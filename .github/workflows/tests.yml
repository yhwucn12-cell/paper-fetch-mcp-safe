name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Offline tests (includes the licence boundary contract)
        run: python -m pytest -q
      - name: Stdio handshake
        run: python -m pytest -q -m local_subprocess
      - name: Copyright-safety audit
        run: |
          printf 'mailto = "ci@example.org"\n' > paper-fetch.toml
          python scripts/paper_download_test.py audit
